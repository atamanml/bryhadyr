# Merged into ~/.hermes/config.yaml by hermes/install.sh (deep merge; keys of the same name are replaced).
# PM cron jobs run on Claude (provider anthropic, ANTHROPIC_API_KEY in ~/.hermes/.env); chats keep the default model.
# `tasks` = your OpenTodo. The URL is substituted at install time; the agent token stays in ~/.hermes/.env (OPENTODO_AGENT_TOKEN)
# and the config keeps the literal ${OPENTODO_AGENT_TOKEN}. `tools.include` limits Hermes to the tools the PM needs, so the full
# schema list does not ride on every Telegram message.
mcp_servers:
  tasks:
    url: "${OPENTODO_MCP_URL}"
    headers:
      Authorization: "Bearer ${OPENTODO_AGENT_TOKEN}"
    timeout: 60
    connect_timeout: 30
    tools:
      include:
        - today_summary
        - list_projects
        - list_tasks
        - get_task
        - search_tasks
        - create_tasks
        - update_tasks
        - complete_tasks
        - move_tasks
        - schedule_tasks
        - add_comment
        - create_sections
        - create_label
model_aliases:
  pm:
    model: claude-sonnet-5-5
    provider: anthropic
  pm-cheap:
    model: claude-haiku-5-5
    provider: anthropic
cron:
  wrap_response: false
# The alias `default` (back to your everyday chat model after `/model pm`) is not here because the model is yours:
# set PM_DEFAULT_MODEL and PM_DEFAULT_PROVIDER in ~/.hermes/.env and hermes/install.sh adds
#   model_aliases.default: {model: $PM_DEFAULT_MODEL, provider: $PM_DEFAULT_PROVIDER}
#   moa.presets.default.enabled: false
# Why the second line: Hermes matches a Mixture-of-Agents preset before any alias, and its built-in preset is also called `default`,
# so `/model default` would start a multi-model ensemble (expensive) instead of your model. Switching the preset off makes the alias win;
# `--provider moa` still reaches the ensemble.
